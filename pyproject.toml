[project]
name = "cesar-len-key"
version = "0.1.0"
description = "Cryptographic program implementing enhanced Caesar cipher with dynamic key"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cesar_len_key", "cli"]

[project.scripts]
cesar-len-key = "cli.main:main"
cesar-len-key-file = "cli.file_crypt:main"
