[project]
name = "cesar-len-key"
version = "0.1.0"
description = "Cryptographic program implementing enhanced Caesar cipher with dynamic key"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "jupyter>=1.1.1",
  "matplotlib>=3.10.9",
  "numpy>=2.4.6",
  "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cesar_len_key", "scripts"]

[project.scripts]
cesar-len-key = "scripts.main:main"
cesar-len-key-file = "scripts.file_crypt:main"
